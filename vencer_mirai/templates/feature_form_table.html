{% extends 'base.html' %}{% block content %}<section class="panel"><p class="muted">{{ help_text }}</p><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">{% for field in fields %}<label>{{ field.label }}{% if field.type=='select' %}<select name="{{ field.name }}">{% for v,l in field.options %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select>{% else %}<input name="{{ field.name }}" type="{{ field.type or 'text' }}" {% if field.required %}required{% endif %} {% if field.value is defined %}value="{{ field.value }}"{% endif %} {% if field.step %}step="{{ field.step }}"{% endif %} {% if field.min is defined %}min="{{ field.min }}"{% endif %}>{% endif %}</label>{% endfor %}<button class="btn primary">{{ submit_label or t('save') }}</button></form></section><section class="panel"><div class="table-wrap"><table><thead><tr>{% for col in columns %}<th>{{ col }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr>{% for value in row %}<td>{{ value }}</td>{% endfor %}</tr>{% else %}<tr><td colspan="{{ columns|length }}">{{ t('no_data') }}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
