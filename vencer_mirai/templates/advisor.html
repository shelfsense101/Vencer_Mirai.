{% extends 'base.html' %}{% block heading %}{{ t('advisor_title') }}{% endblock %}{% block content %}<p class="muted">{{ t('forecast_help') }} {{ t('estimate_disclaimer') }}</p><section class="panel">{% for level,message in insights %}<article class="insight {{ level }}"><span class="pill {{ 'bad' if level=='high' else 'warn' if level=='medium' else 'good' }}">{{ level|capitalize }}</span><p>{{ message }}</p></article>{% else %}<p>{{ t('no_data') }}</p>{% endfor %}</section>{% endblock %}
