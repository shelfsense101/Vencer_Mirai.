<form method="POST" action="{{ url_for('set_language') }}" class="language-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="languageSelect">{{ t('language') }}</label><select id="languageSelect" name="language" onchange="this.form.submit()">{% for code, language_name in languages.items() %}<option value="{{ code }}" {% if current_language == code %}selected{% endif %}>{{ language_name }}</option>{% endfor %}</select></form>
